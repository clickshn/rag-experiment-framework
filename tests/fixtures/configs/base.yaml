# 시험용 기본 구성: 생성만 수준, arm 3개, 판정 3개(코드 규칙·주 판정·보조 판정)
name: test-base
level: generation_only
corpus: {type: fake_corpus, snapshot_sha256: "aaaa1111"}
chunker: {type: fake_chunker, max_chars: 800}
retriever: {type: fake_oracle, distractors: 2, seed: 7}
generators:
  A:
    type: fake_chat
    base_url: ${GEN_A_URL}
    api_key: ${GEN_A_KEY}
    model: model-a
    params: {temperature: 0, max_tokens: 2048}
    meta: {price_per_1m_input: 1.5, price_per_1m_output: 6.0, deploy: cloud, license: proprietary}
    run: {concurrency: 8}
  B:
    type: fake_chat
    base_url: ${LOCAL_URL}
    model: local-27b
    revision: abc123
    params: {temperature: 0, max_tokens: 2048}
    meta: {gpu_cost_per_hour: 2.0, vram_gb: 31, license: Apache-2.0, deploy: on_prem, air_gapped: true}
  C:
    type: fake_chat
    base_url: ${LOCAL_URL}
    model: local-8b
    params: {temperature: 0.2, max_tokens: 1024}
prompt: prompt.md
judges:
  - {type: fake_rules, role: rules}
  - {id: judge_main, type: fake_llm, role: primary, base_url: "${JUDGE1_URL}", model: judge-x, params: {temperature: 0}}
  - {id: judge_side, type: fake_llm, role: secondary, base_url: "${JUDGE2_URL}", model: judge-y}
questions: questions.jsonl
repeats: 3
