# 커밋 전 검사. 설치: uv run pre-commit install
# gitleaks는 PATH의 바이너리를 쓴다(gitleaks-system). CI는 별도 작업에서 전체 이력을 검사한다.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: \.(bat|ps1)$
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-system
        pass_filenames: false

  - repo: local
    hooks:
      - id: no-real-urls
        name: 예제에 실제 서버 주소 금지
        entry: python scripts/check_no_real_urls.py
        language: python
        files: ^examples/
        types: [text]
